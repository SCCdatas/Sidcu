services:
  # ---------------------------------------------------------------- Backend
  - type: web
    name: sidcu-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: jdbc:postgresql://ep-icy-base-be1eo1as-pooler.c-9.us-east-2.aws.neon.tech/neondb?sslmode=require
        sync: false          # se escribe en el panel de Render
      - key: neondb_owner
        sync: false
      - key: npg_9sYFDbgPI7ik
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"           # luego cámbialo por la URL del frontend
      - key: DDL_AUTO
        value: update
      - key: SEED_ENABLED
        value: "false"

  # --------------------------------------------------------------- Frontend
  - type: web
    name: sidcu-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # react-router: cualquier ruta debe devolver index.html
      - type: rewrite
        source: /*
        destination: /index.html
