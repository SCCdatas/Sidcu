spring.application.name=sidcu-backend

# ---------------------------------------------------------------------------
# Base de datos (PostgreSQL) - todo se inyecta por variables de entorno,
# nunca se escriben credenciales en este archivo. Ver .env.example
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Puerto del servidor (Render inyecta PORT automáticamente; 8080 por defecto en local)
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Aplicación
# ---------------------------------------------------------------------------
# Orígenes permitidos por CORS, separados por comas ("*" = cualquiera)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
# Carga de datos de ejemplo al iniciar si la base de datos está vacía
app.seed.enabled=${SEED_ENABLED:true}

# ---------------------------------------------------------------------------
# Documentación OpenAPI (SpringDoc) -> /swagger-ui.html
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------------------
# Scalar API Reference -> /scalar
# ---------------------------------------------------------------------------
scalar.enabled=true
scalar.url=/v3/api-docs
scalar.path=/scalar
